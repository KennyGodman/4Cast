<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#2e1052" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="8" />

  <!-- Monogram 4 + C graphic -->
  <g transform="translate(64, 70)" filter="url(#glow)">
    <!-- Number 4 Shape -->
    <path d="M 170,40 L 40,240 L 220,240 M 170,40 L 170,320" 
          fill="none" stroke="url(#brandGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter C Arc Shape -->
    <path d="M 330,120 A 100,100 0 1,0 330,260" 
          fill="none" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round"/>
  </g>

  <!-- 4CAST Label -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="64" 
        letter-spacing="6" 
        fill="#ffffff">4CAST</text>
</svg>
